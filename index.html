<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Game Hub</title>
<meta name="description" content="Classic Game Hub: classic board and puzzle games for Android.">
<style>
  :root { --bg: #f7f7f9; --fg: #1b1d22; --muted: #5d6270; --card: #ffffff; --line: #e2e4ea; --link: #0b6bcb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1218; --fg: #e8eaf0; --muted: #a2a8b6; --card: #171b23; --line: #2a303b; --link: #6cb6ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1.1rem; margin: 0 0 8px; }
  a { color: var(--link); }
  ul { margin: 0; padding-inline-start: 20px; }
  [dir="rtl"] { text-align: right; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Classic Game Hub</h1>
  <p class="sub">Classic board and puzzle games for Android.</p>

  <div class="card">
    <h2>Legal</h2>
    <ul>
      <li><a href="privacy-policy.html">Privacy policy</a></li>
      <li><a href="privacy-policy.html#he">מדיניות פרטיות (עברית)</a></li>
    </ul>
  </div>

  <div class="card">
    <h2>Contact</h2>
    <p style="margin:0"><a href="mailto:tzearts@gmail.com">tzearts@gmail.com</a></p>
  </div>

  <div class="card" dir="rtl" lang="he">
    <h2>Classic Game Hub</h2>
    <p style="margin:0">משחקי לוח ופאזלים קלאסיים לאנדרואיד. ליצירת קשר: <a href="mailto:tzearts@gmail.com">tzearts@gmail.com</a></p>
  </div>

  <footer>© Classic Game Hub</footer>
</main>
</body>
</html>
